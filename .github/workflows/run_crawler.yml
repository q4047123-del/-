name: Run Stock Crawler

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions 採用 UTC 時間！
    # UTC 09:30 等於台灣時間 (UTC+8) 下午 17:30（正好在台股收盤與盤後資料更新後）
    - cron: '30 9 * * 1-5'

jobs:
  run-python:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run crawler script
        run: |
          python fetch_tw_sectors.py

      - name: Commit and push updated json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global http.version HTTP/1.1
          git add tw_stocks_history.json
          git diff --staged --quiet || git commit -m "Auto-update stock history json via Python"
          git push origin HEAD
