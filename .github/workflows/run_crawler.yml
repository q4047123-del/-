name: Fugle Intraday & After-Hours Auto Update

on:
  schedule:
    # 1. 台股盤中即時更新：週一至週五 09:00 ~ 13:45，每 15 分鐘自動執行一次
    - cron: '*/15 9-13 * * 1-5'
      timezone: 'Asia/Taipei'

    # 2. 台股收盤與證交所權證/興櫃完整結算：週一至週五 14:30、16:30 各執行一次
    - cron: '30 14,16 * * 1-5'
      timezone: 'Asia/Taipei'

    # 3. 美股開盤與跨夜總經 (VIX/美債/NVDA) 同步：週一至週五 22:30 及隔日 05:30 執行
    - cron: '30 5,22 * * 1-5'
      timezone: 'Asia/Taipei'

  workflow_dispatch: # 保留手動一鍵觸發按鈕

# ★ 防撞車機制：若上一次排程還沒跑完，自動取消舊排程，避免高頻率執行時 git push 衝突
concurrency:
  group: stock-data-updater
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  run-python-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install requests yfinance

      - name: Run Stock & Fugle Engine
        env:
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
        run: |
          python update_stocks.py

      - name: Commit and push generated JSON back to repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add tw_stocks_history.json
          git diff --staged --quiet || git commit -m "Auto-update intraday & Fugle stock data [skip ci]"
          git pull --rebase origin main || true
          git push
